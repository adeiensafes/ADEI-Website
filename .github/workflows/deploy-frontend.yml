name: Deploy Frontend to FTP

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
  workflow_dispatch: # Allow manual trigger

jobs:
  deploy-frontend:
    name: Deploy Frontend to FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Prepare deployment files
        run: |
          cd frontend
          echo "✅ Build completed successfully!"
          echo "📁 Build folder contents:"
          ls -la build/
          
          # Create deployment info
          echo "Frontend deployed on: $(date)" > build/deployment-info.txt
          echo "Commit: ${{ github.sha }}" >> build/deployment-info.txt

      - name: Deploy Frontend to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          port: ${{ secrets.FTP_PORT }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./frontend/build/
          server-dir: ${{ secrets.FTP_FRONTEND_DIR || '../public_html/' }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.DS_Store
            **/node_modules/**

      - name: Post-deployment success
        run: |
          echo "✅ Frontend deployment completed successfully!"
          echo "🌐 Website URL: https://adei-ensaf.ma"
          echo "📅 Deployed at: $(date)"
          echo "🔄 Changes should be visible within 1-2 minutes"
          echo ""
          echo "🧹 Clear browser cache if you don't see changes:"
          echo "  - Chrome/Edge: Ctrl+Shift+R"
          echo "  - Firefox: Ctrl+F5"
          echo "  - Or try incognito/private mode"