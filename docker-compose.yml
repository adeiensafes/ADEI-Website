services:
  mysql:
    image: mysql:8.0
    container_name: adei_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: adei_db
      MYSQL_USER: adei_user
      MYSQL_PASSWORD: adei_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - adei_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: adei_phpmyadmin
    restart: always
    ports:
      - "8082:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: adei_user
      PMA_PASSWORD: adei_password
    depends_on:
      - mysql
    networks:
      - adei_network

volumes:
  mysql_data:

networks:
  adei_network:
    driver: bridge